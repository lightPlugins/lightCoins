# 标题
titles:
  transactions:
    static:
      onDeposit:
        upperTitle: "<gray>你 <green>获得了"
        lowerTitle: "<green>#amount# <gray>#currency#"
      onWithdraw:
        upperTitle: "<gray>你 <red>支付了"
        lowerTitle: "<red>#amount# <gray>#currency#"
      onPay:
        upperTitle: "<yellow>#target# <gray>付给了你"
        lowerTitle: "<yellow>#amount# <gray>#currency#"
    animated:
      onDeposit:
        start:
          upperTitle: "<green>存入"
          lowerTitle: "<gray>当前余额: <green>#counter# <gray>#currency#"
        end:
          upperTitle: "<gray>你 <green>获得了"
          lowerTitle: "<green>#amount# <gray>#currency#"
      onWithdraw:
        start:
          upperTitle: "<red>取出"
          lowerTitle: "<gray>当前余额: <red>#counter# <gray>#currency#"
        end:
          upperTitle: "<gray>你 <red>支付了"
          lowerTitle: "<red>#amount# <gray>#currency#"
      onPay:
        start:
          upperTitle: "<green>支付"
          lowerTitle: "<gray>当前余额: <green>#counter# <gray>#currency#"
        end:
          upperTitle: "<yellow>#target# <gray>付给了你"
          lowerTitle: "<yellow>#amount# <gray>#currency#"
