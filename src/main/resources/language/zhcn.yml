#           - '<red>你没有权限'
#           - '这么做! 你需要权限 <dark_red>#permission#<red>!'
#       result: '<red>你没有权限这么做! 你需要权限 <dark_red>#permission#<red>!'
#
version: 1 # 请勿触碰此项 :( (否则插件不会正常工作, 也许吧 :o)
prefix: "<yellow><bold><italic>light<gray>Coins <dark_gray>● <reset>"
noPermission: "<red>你没有权限这么做! 你需要权限 <dark_red>#permission#<red>!"
wrongSyntax: "<red>命令格式错误. <gray>请使用命令 <red>#syntax#"
noNumber: "<red>这不是有效数字! 请正确输入数字."
noNegativ: "<red>你不能填入负数!"
playerNotFound: "<red>玩家 <dark_red>#player#<red> 不存在!"
somethingWentWrong: "<red>出错了! 相关信息: #info#"
reloadSuccess: "<gray>插件<yellow>成功<gray>重载!"
starterCoins: "<gray>你收到了 <yellow>#coins# <gray>#currency# 的新手奖励!"
playerDeleted: "<gray>你删除了玩家 <yellow>#player#<gray>."
onlyConsole: "<red>这条命令只能在控制台执行!"
# Vault 经济
coinsShow: "<gray>你拥有 <yellow>#coins#<gray> #currency#."
coinsShowTarget: "<gray>玩家 <yellow>#player#<gray> 拥有 <yellow>#coins# <gray>#currency#"
coinsAdd: "<gray>你给予了玩家 <yellow>#player#<gray> <yellow>#coins# <gray>#currency#."
coinsAddTarget: "<gray>玩家 <yellow>#player# <gray>给予了你 <yellow>#coins# <gray>#currency#."
coinsAddAll: "<gray>你给予了所有 <yellow>#amount#<gray> 名玩家 <yellow>#coins# <gray>#currency#."
coinsAddAllFailed: "<red>未能成功给予 <dark_red>#amount# 名玩家<red> <dark_red>#coins# <red>#currency#<red>."
coinsSet: "<gray>你将玩家 <yellow>#player#<gray> 的 <gray>#currency# 数量设置为了 <yellow>#coins#."
coinsSetTarget: "<gray>玩家 <yellow>#player# <gray>将你的 <gray>#currency# 数量设置为了 <yellow>#coins#."
coinsRemove: "<gray>你从玩家 <yellow>#player#<gray> 的钱包中取走了 <yellow>#coins# <gray>#currency#."
coinsRemoveTarget: "<gray>玩家 <yellow>#player# <gray>从你的钱包中取走了 <yellow>#coins# <gray>#currency#."
# 玩家命令
pay: "<gray>你付给了 <yellow>#target#<gray> <yellow>#coins# <gray>#currency#."
